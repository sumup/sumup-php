name: Codegen CI

on:
  push:
    branches:
      - main
    paths:
      - "codegen/**"
      - "src/**"
      - "openapi.json"
      - "composer.json"
      - "justfile"
      - ".github/workflows/codegen.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "codegen/**"
      - "src/**"
      - "openapi.json"
      - "composer.json"
      - "justfile"
      - ".github/workflows/codegen.yaml"

permissions:
  contents: read

defaults:
  run:
    working-directory: ./codegen

env:
  GOLANGCI_LINT_VERSION: v2.9.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: './codegen/go.mod'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ./codegen

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: './codegen/go.mod'

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.2.35'
          coverage: none

      - name: Run tests
        run: go test ./...

  generated:
    name: Generated SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: './codegen/go.mod'

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.2.35'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
        working-directory: .

      - name: Generate SDK
        run: go run . generate --out ../src ../openapi.json

      - name: Format generated SDK
        run: vendor/bin/php-cs-fixer fix --using-cache=no
        working-directory: .

      - name: Ensure generated SDK is up to date
        run: |
          git diff --exit-code -- src
          test -z "$(git ls-files --others --exclude-standard -- src)"
        working-directory: .
